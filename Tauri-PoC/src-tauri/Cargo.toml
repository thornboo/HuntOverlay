[package]
name = "huntoverlay-tauri-poc"
version = "0.1.0"
description = "Isolated Tauri overlay feasibility prototype for HuntOverlay"
authors = ["HuntOverlay contributors"]
edition = "2021"

[lib]
name = "huntoverlay_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = ["macos-private-api"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_UI_Input_KeyboardAndMouse"
] }
